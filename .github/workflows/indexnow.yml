name: Avisar a IndexNow
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Esperar a que Vercel publique
        run: sleep 120
      - name: Enviar las URL del sitemap a IndexNow (Bing, Copilot, parte de ChatGPT)
        run: |
          KEY=$(cat indexnow-key.txt)
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -s .)
          jq -n --arg key "$KEY" --argjson urls "$URLS" \
            '{host:"loquenocuentan.com",key:$key,keyLocation:("https://loquenocuentan.com/"+$key+".txt"),urlList:$urls}' > body.json
          curl -sS -o /dev/null -w "IndexNow respondió %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" --data @body.json
